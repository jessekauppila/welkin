[project]
name = "welkin"
version = "0.0.1"
description = "A shared sky-watching system: cameras watch the sky, models form opinions, people correct them."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.4",
  "anthropic>=1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
welkin-ingest = "welkin.ingest:main"
welkin-picker = "welkin.picker:main"
welkin-control = "welkin.picker:control_main"
welkin-seer = "welkin.seer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
